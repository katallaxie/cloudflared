name: Build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  check_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Checkout cloudflared, from https://github.com/cloudflare/cloudflared.git /cloudflared
      - uses: actions/checkout@v7
        with:
          repository: cloudflare/cloudflared
          path: cloudflared
          ref: ${{ inputs.ref }}

      # Enable QEMU for ARM emulation in Buildx
      - uses: docker/setup-qemu-action@v4

      # Setup go for cross-compilation
      - uses: actions/setup-go@v6
        with:
          go-version-file: cloudflared/go.mod

      - uses: docker/setup-buildx-action@v4

      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi curl git tar

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - working-directory: cloudflared
        run: |
          go mod download

      - working-directory: cloudflared
        run: |
          GOOS=linux GOARCH=arm GOARM=5 go build -o cloudflared/cloudflared ./cmd/cloudflared

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            katallaxie/cloudflared:${{ steps.check_release.outputs.new_version }}
            katallaxie/cloudflared:latest
          build-args: |
            CLOUDFLARED_VERSION=${{ inputs.ref }}
          platforms: linux/arm/v5
